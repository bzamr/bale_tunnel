[workspace]
resolver = "2"
members = [
    "client",
    "server",
    "shared",
]

[workspace.package]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
# Async runtime
tokio = { version = "1.52.2", features = ["full"] }

# HTTP client
reqwest = { version = "0.13.3", features = ["json", "multipart", "native-tls"] }

# Webhook server (server side)
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["trace"] }

# SOCKS5 client/server
fast-socks5 = "1.0.0"

# UUID for session_id
uuid = { version = "1.23.1", features = ["v4"] }

# Logging & diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Configuration
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Binary buffer
bytes = "1.11.1"

# Utilities
futures = "0.3"

tokio-util = { version = "0.7", features = ["rt"] }

